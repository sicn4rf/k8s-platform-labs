apiVersion: v1
kind: Secret
metadata:
  name: mariadb-secret
# NOTE: For local lab use only. Replace placeholders before applying.
# Generate values with: echo -n "your-password" | base64
data:
  MARIADB_ROOT_PASSWORD: "<base64-encoded>"
  MARIADB_USER: "<base64-encoded>"
  MARIADB_PASSWORD: "<base64-encoded>"
