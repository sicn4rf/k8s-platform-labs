apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: test-httproute-labeled
  namespace: dev
  labels:
    platform/environment: dev
spec:
  parentRefs:
    - name: my-gateway
      namespace: kgateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /status/200
      backendRefs:
        - name: httpbin
          port: 8000
